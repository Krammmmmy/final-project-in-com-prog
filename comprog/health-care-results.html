<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
      <link rel="stylesheet" href="styles.css">
          <script src="https://cdn.jsdelivr.net/npm/sweetalert2@10"></script>
  <title>Health Care</title>
    <style>
    /* Custom styles for SweetAlert */
    .swal2-popup {
      font-size: .75rem;
      border-radius: 1px;
      background-color: #f8f9fa;
      color: #000000;
      
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 16px;
    background: rgb(216, 216, 227, 0.3);
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.9);
    backdrop-filter: blur(20px);
    width: 90%;
    height: auto;
    margin: 1px;
    }
    .swal2-title {
      font-weight: bold;
      color: #000000; /* Custom title color */
    }
    .swal2-content {
      color: #000000; /* Custom text color */
    }
    .swal2-actions {
      display: flex;
      justify-content: center;
    }
    .swal2-confirm {
      background-color: #000000; /* Custom button background color */
      border-color: #000000; /* Custom button border color */
      font-weight: bold;
      font-size: .75rem;
      padding: 5px 10px;
    }
    .swal2-confirm:hover {
      background-color: #0772e4; /* Custom hover color */
      border-color: #000000;
      color: #ffffff;
    }
    
    .tooltip {
      position: relative;
      display: inline-block;
    }

    .tooltip .tooltiptext0,
    .tooltip .tooltiptext {
      visibility: hidden;
      width: 200px;
      color: #ffff;
      text-align: center;
      padding: 15px;
      position: absolute;
      z-index: 1;
      bottom: 125%;
      left: 50%;
      margin-left: -100px;
      margin-bottom: -30px
      opacity: 0;
      border-radius: 16px;
    background: rgb(2, 2, 2, 0.8);
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.9);
    backdrop-filter: blur(50px);
    font-family: Times New Roman;
    }
    
    .tooltip:hover .tooltiptext0,
    .tooltip:hover .tooltiptext {
      visibility: visible;
      opacity: 1;
    }

    .question-mark {
      display: inline-block;
      cursor: help;
      border: 1px solid black;
      border-radius: 50%;
      width: 15px;
      height: 15px;
      padding: 0;
      margin: 0;
      align-content: center;
      text-align: center;
    }
    
.tabcontent h1 {
  margin: 15px;
  border-bottom: 1px solid black;
  font-size: 20px;
  padding: 5px;
}
  </style>
</head>
<body class="body1" class="bodybg">  
  <div>
    <div class="wave"></div>
    <div class="wave"></div>
    <div class="wave"></div>
 </div>
  <div class="tab">
    <button class="tablinks" onclick="openTab(event, 'tab1')" id="defaultOpen">Progress</button>
    <button class="tablinks" onclick="openTab(event, 'tab2')">Calculators</button>
  </div>
  <div id="tab1" class="tabcontent">
    <h1>Remaining Intake</h1>
    <p id="bmiResult" style="font-size: 10px; text-align: end; margin: 0;  font-weight: 1000; padding: 0 6px 5px 0;">Your BMI:</p>
      <div class="IRemaining">
        <div class="kcalR">
      <h2 class="UpperT" style="text-align: left; top: -9px;">Calorie <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-flame"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg><div class="space"></div><p id="remainingEnergy" style="width: 130px;"></p></h2>
      <div class="progress-meter">
        <div id="consumedEnergyMeter" class="meter-bar"></div>
    </div>
    </div>
        <div class="mLR">
      <h2 class="UpperT" style="text-align: left; top: -9px;">Water <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-droplet"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg><div class="space"></div><p id="remainingWater" style="width: 130px;"></p></h2>
      <div class="progress-meter">
        <div id="consumedWaterMeter" class="meter-bar"></div>
    </div>
    </div>
    </div>

    <div class="resetB">
      <button class="reset" onclick="resetIntakes()" href="#">Reset</button>
      <div class="tooltip">
        <span class="tooltiptext">Press the reset button to reset the remaining calorie and water intake.</span>
      </div>
      <span class="question-mark" onclick="showTooltip()">?</span>
    </div>
    
    <h1 class="CI">Consumed Intake</h1>
    <div class="RI">
    <div class="kcalI">
      <input type="number" id="consumedEnergy" placeholder="Enter kcal" class="input99">
      <button onclick="subtractConsumedEnergy()" class="button1">Save</button>
    </div>

    <div class="mLI">

  </div>
  </div>

  <div class="tooltip">

    <div class="main-content-hc">
      <div class="RNI">

</div>
<div class="scnd">

</div>
  <button onclick="setRecommendedIntakes()" style="display: flex;margin: 0 auto;">Confirm</button>
    <p id="recommendedEnergy" style="height: auto;
  width: auto;
  font-size: 10px;
  font-weight: 700;
  display: flex;
  flex-direction: row;
  justify-content: space-around;">Calories</p>
    <p id="recommendedWater" style="height: auto;
  width: auto;
  font-size: 10px;
  font-weight: 700;
  display: flex;
  flex-direction: row;
  justify-content: space-around;">Water:</p>
  </div>
  </div>

  </div>
      <div class="bottom-navbar">

        <button onclick="redirectToHome()">
          <svg

          </svg>
        </button>
        <button onclick="redirectToAboutUs()"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-help"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg></button>
    </div>
    </div>
    
    <script src="script.js" defer></script>
    <script>
    // Functions for setting, subtracting, and updating intakes...
    
    function resetIntakes() {
      localStorage.removeItem('remainingEnergy');
      localStorage.removeItem('remainingWater');
      setRecommendedIntakes();

      setTimeout(function() {
                location.reload();
            }, 100);

     
    }
    
function displayIntakes() {
      const ageInput = document.getElementById('age');
      const recommendedEnergyDiv = document.getElementById('recommendedEnergy');
      const recommendedWaterDiv = document.getElementById('recommendedWater');
      const remainingEnergyDiv = document.getElementById('remainingEnergy');
      const remainingWaterDiv = document.getElementById('remainingWater');
      
      // Display age
      const age = localStorage.getItem('age');
      if (age) {
        ageInput.value = age;
      }

      // Display recommended energy intake
      const recommendedEnergy = localStorage.getItem('recommendedEnergy');
      if (recommendedEnergy) {
        recommendedEnergyDiv.textContent = `Calories: ${recommendedEnergy} kcal`;
      }

      // Display recommended water intake
      const recommendedWater = localStorage.getItem('recommendedWater');
      if (recommendedWater) {
        recommendedWaterDiv.textContent = `Water: ${recommendedWater} mL`;
      }

      // Display remaining energy intake
      const remainingEnergy = localStorage.getItem('remainingEnergy');
      if (remainingEnergy) {
        remainingEnergyDiv.textContent = `${remainingEnergy > 0 ? remainingEnergy : 0}/ ${recommendedEnergy} kcal`;
      }

      // Display remaining water intake
      const remainingWater = localStorage.getItem('remainingWater');
      if (remainingWater) {
        remainingWaterDiv.textContent = `${remainingWater > 0 ? remainingWater : 0}/ ${recommendedWater} mL`;
      }
    }

    // Call the displayIntakes function when the page loads
    displayIntakes();
    
    function showTooltip() {
      var tooltip = document.querySelector('.tooltiptext');
      tooltip.style.visibility = tooltip.style.visibility === 'visible' ? 'hidden' : 'visible';
    }
    function showTooltip0() {
      var tooltip = document.querySelector('.tooltiptext0');
      tooltip.style.visibility = tooltip.style.visibility === 'visible' ? 'hidden' : 'visible';
    }
  </script>
</body>
</html>
